[package]
name = "prodeck"
version = "0.1.60"
description = "ProDeck — the production booth hub: ProPresenter, Planning Center, consoles, crew phones, and lobby NFC in one app"
authors = ["ProDeck"]
edition = "2021"

[lib]
name = "prodeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
anyhow = "1"
url = "2"
mdns-sd = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
urlencoding = "2"
cpal = "0.15"
midir = "0.10"
rosc = "0.10"
hound = "3.5"
base64 = "0.22"
# RS256 signing for the GA4 service-account JWT (realtime viewer count).
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
dirs = "5"
bytes = "1"
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rustfft = "6"
include_dir = "0.7"
mp3lame-encoder = "0.2.4"
sha2 = "0.11.0"
hex = "0.4.3"
uuid = { version = "1.24.0", features = ["v4"] }
# default features pull in isahc (a second HTTP stack + libcurl); we build the
# request ourselves and send it with the reqwest client already in the tree.
web-push = { version = "0.10", default-features = false }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
