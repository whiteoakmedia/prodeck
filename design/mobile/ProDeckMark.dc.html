<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-flex;line-height:0">
  <sc-if value="{{ isA }}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="12.5" y="12.5" width="26" height="75" rx="7.5" stroke="{{ fg }}" stroke-width="9"></rect>
      <rect x="53.5" y="61.5" width="34" height="26" rx="7.5" stroke="{{ fg }}" stroke-width="9"></rect>
      <rect x="49" y="8" width="43" height="43" rx="15" fill="{{ accent }}"></rect>
    </svg>
  </sc-if>
  <sc-if value="{{ isF }}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="11.25" y="11.25" width="25.5" height="77.5" rx="7.25" stroke="{{ fg }}" stroke-width="10.5"></rect>
      <rect x="53.25" y="63.25" width="35.5" height="25.5" rx="7.25" stroke="{{ fg }}" stroke-width="10.5"></rect>
      <rect x="48" y="6" width="46" height="46" rx="16" fill="{{ accent }}"></rect>
    </svg>
  </sc-if>
  <sc-if value="{{ isA2 }}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="13.25" y="13.25" width="24.5" height="73.5" rx="7" stroke="{{ fg }}" stroke-width="10.5"></rect>
      <rect x="54.25" y="62.25" width="32.5" height="24.5" rx="7" stroke="{{ fg }}" stroke-width="10.5"></rect>
      <rect x="49" y="8" width="43" height="43" rx="15" fill="{{ accent }}"></rect>
    </svg>
  </sc-if>
  <sc-if value="{{ isA3 }}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="10.75" y="10.75" width="26.5" height="82.5" rx="8" stroke="{{ fg }}" stroke-width="9.5"></rect>
      <rect x="52.75" y="62.75" width="36.5" height="26.5" rx="8" stroke="{{ fg }}" stroke-width="9.5"></rect>
      <rect x="48" y="6" width="46" height="46" rx="16" fill="{{ accent }}"></rect>
    </svg>
  </sc-if>
  <sc-if value="{{ isA4 }}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="12.5" y="12.5" width="26" height="75" rx="9.5" stroke="{{ fg }}" stroke-width="9"></rect>
      <rect x="53.5" y="61.5" width="34" height="26" rx="9.5" stroke="{{ fg }}" stroke-width="9"></rect>
      <rect x="49" y="8" width="43" height="43" rx="12" fill="{{ accent }}"></rect>
    </svg>
  </sc-if>
  <sc-if value="{{ isA5 }}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 32 32" width="{{ size }}" height="{{ size }}" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
      <rect x="4" y="3" width="8" height="26" rx="2" fill="{{ fg }}"></rect>
      <rect x="16" y="3" width="13" height="13" rx="3" fill="{{ accent }}"></rect>
      <rect x="16" y="20" width="13" height="9" rx="2" fill="{{ fg }}"></rect>
    </svg>
  </sc-if>
  <sc-if value="{{ isB }}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="12.5" y="12.5" width="75" height="75" rx="21.5" stroke="{{ fg }}" stroke-width="9"></rect>
      <rect x="30.5" y="30.5" width="39" height="39" rx="11.5" stroke="{{ fg }}" stroke-width="9"></rect>
      <rect x="43" y="43" width="14" height="14" rx="5" fill="{{ accent }}"></rect>
    </svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a&quot;,&quot;b&quot;],&quot;default&quot;:&quot;a&quot;,&quot;tsType&quot;:&quot;'a'|'b'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:96,&quot;min&quot;:16,&quot;max&quot;:1024,&quot;tsType&quot;:&quot;number&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;color&quot;,&quot;white&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;color&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5b8def&quot;,&quot;options&quot;:[&quot;#5b8def&quot;,&quot;#79a4f6&quot;,&quot;#3fcf8e&quot;,&quot;#eef3fa&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const tone = this.props.tone || 'color';
    const fg = tone === 'white' ? '#ffffff' : tone === 'dark' ? '#0e131b' : '#eef3fa';
    const accent = tone === 'color' ? (this.props.accent || '#5b8def') : fg;
    const v = this.props.variant || 'a';
    return { fg, accent, size: Number(this.props.size) || 64, isA: v === 'a', isB: v === 'b', isA2: v === 'a2', isA3: v === 'a3', isA4: v === 'a4', isA5: v === 'a5', isF: v === 'f' };
  }
}
</script>
</body>
</html>
