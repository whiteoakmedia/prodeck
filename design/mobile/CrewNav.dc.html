<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:0 0 auto;background:#131a24;box-shadow:0 -1px 0 #232f3e;padding:9px 8px 22px;display:flex;justify-content:space-between;align-items:flex-start">
  <div style="width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cHome }}">
    <div style="height:24px;display:flex;align-items:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="2" width="5" height="20" rx="2"></rect><rect x="11" y="2" width="10" height="10" rx="3"></rect><rect x="11" y="15" width="10" height="7" rx="2"></rect></svg>
    </div>
    <div style="font-size:10.5px;font-weight:500;letter-spacing:.01em">Home</div>
  </div>
  <div style="width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cChat }}">
    <div style="height:24px;display:flex;align-items:center;position:relative">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="4" width="20" height="14" rx="4.5"></rect><rect x="6" y="17" width="5" height="4" rx="1.5"></rect></svg>
      <sc-if value="{{ showBadge }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:-4px;left:14px;min-width:18px;height:18px;border-radius:9px;background:#5b8def;color:#0e131b;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 0 2px #131a24">{{ badge }}</div>
      </sc-if>
    </div>
    <div style="font-size:10.5px;font-weight:500;letter-spacing:.01em">Chat</div>
  </div>
  <div style="width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cList }}">
    <div style="height:24px;display:flex;align-items:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"></rect><path d="M8 12.5l2.8 2.8L16.5 9.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
    <div style="font-size:10.5px;font-weight:500;letter-spacing:.01em">Checklist</div>
  </div>
  <div style="width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cDash }}">
    <div style="height:24px;display:flex;align-items:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2.5"></rect><rect x="13" y="3" width="8" height="8" rx="2.5"></rect><rect x="3" y="13" width="8" height="8" rx="2.5"></rect><rect x="13" y="13" width="8" height="8" rx="2.5"></rect></svg>
    </div>
    <div style="font-size:10.5px;font-weight:500;letter-spacing:.01em">Dashboards</div>
  </div>
  <div style="width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cMore }}">
    <div style="height:24px;display:flex;align-items:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.1"></circle><circle cx="12" cy="12" r="2.1"></circle><circle cx="19" cy="12" r="2.1"></circle></svg>
    </div>
    <div style="font-size:10.5px;font-weight:500;letter-spacing:.01em">More</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;chat&quot;,&quot;checklist&quot;,&quot;dash&quot;,&quot;more&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;6&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'home';
    const on = '#79a4f6', off = '#6d7f95';
    const badge = this.props.badge;
    return {
      cHome: a === 'home' ? on : off,
      cChat: a === 'chat' ? on : off,
      cList: a === 'checklist' ? on : off,
      cDash: a === 'dash' ? on : off,
      cMore: a === 'more' ? on : off,
      badge, showBadge: !!badge,
    };
  }
}
</script>
</body>
</html>
